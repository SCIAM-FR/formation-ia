# SQUELETTE section 8 — votre serveur MCP du TP2 derrière la gateway, protégé par un jeton Keycloak.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: catalogue
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: catalogue
        static:
          host: host.docker.internal      # votre poste, vu depuis kind
          port: REMPLACER                 # TODO — le port de votre serveur Quarkus (mvn quarkus:dev)
          path: /mcp                      # TODO — le point d'accès réel exposé par votre serveur
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - { name: agentgateway-proxy, namespace: agentgateway-system, sectionName: mcp }
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
      backendRefs:
        - { group: agentgateway.dev, kind: AgentgatewayBackend, name: catalogue }
---
